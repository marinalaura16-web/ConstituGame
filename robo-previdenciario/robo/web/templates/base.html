<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Triagem de publicações{% endblock %}</title>
<style>
  :root { --fundo:#f6f7f9; --cartao:#fff; --texto:#1d2330; --suave:#5d6679; --borda:#dde1e8;
          --ok:#1b7f4b; --pend:#8a6d00; --aten:#b3261e; --azul:#1f4fa3; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--fundo); color:var(--texto); }
  header { background:#1d2330; color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  header a { color:#fff; text-decoration:none; font-weight:600; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  .cartao { background:var(--cartao); border:1px solid var(--borda); border-radius:8px; padding:14px 16px; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; background:var(--cartao); }
  th, td { padding:8px 10px; border-bottom:1px solid var(--borda); text-align:left; vertical-align:top; }
  th { font-size:13px; color:var(--suave); font-weight:600; }
  .tabela { overflow-x:auto; border:1px solid var(--borda); border-radius:8px; }
  .etq { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600; border:1px solid currentColor; white-space:nowrap; }
  .ok { color:var(--ok); } .pendente { color:var(--pend); } .atencao { color:var(--aten); } .nao_se_aplica { color:var(--suave); }
  .vencido { background:#fde8e7; } .hoje { background:#fff4e0; }
  .suave { color:var(--suave); font-size:13px; }
  button, select, input { font:inherit; padding:5px 10px; border-radius:6px; border:1px solid var(--borda); background:#fff; }
  button { cursor:pointer; } button.primario { background:var(--azul); color:#fff; border-color:var(--azul); }
  pre { white-space:pre-wrap; background:#f1f3f6; padding:12px; border-radius:6px; max-height:420px; overflow:auto; font-size:13px; }
  .item { display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--borda); }
  .item:last-child { border-bottom:0; }
  .item .corpo { flex:1; min-width:0; }
  .feito .corpo { opacity:.55; text-decoration:line-through; }
  form.inline { display:inline; }
  .grade { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:8px 16px; }
  @media (prefers-color-scheme: dark) {
    :root { --fundo:#14171d; --cartao:#1d2129; --texto:#e7e9ee; --suave:#9aa3b5; --borda:#2f3542; --ok:#5fcf8f; --pend:#e0c050; --aten:#ff7b72; --azul:#5b8def; }
    pre { background:#252a34; } button, select, input { background:#252a34; color:var(--texto); }
    .vencido { background:#3a1f1f; } .hoje { background:#3a301a; }
  }
</style>
</head>
<body>
<header><a href="/">⚖️ Triagem de publicações</a><span class="suave" style="color:#c9cfdb">usuário: {{ quem }}</span></header>
<main>{% block conteudo %}{% endblock %}</main>
</body>
</html>
